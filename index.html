.st-app {
  --bg:#FAFAF8; --card:#FFFFFF; --ink:#1F2328; --muted:#6B7280; --line:#E7E5E0;
  --income:#1A7F4B; --expense:#B4412F; --accent:#2F5D8A;
  background:var(--bg); color:var(--ink); min-height:100%;
  padding:32px 16px 64px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.st-app * { box-sizing:border-box; }
.st-wrap { max-width:760px; margin:0 auto; }
.st-num { font-variant-numeric:tabular-nums; }

.st-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.st-title { font-size:20px; font-weight:600; margin:0; }
.st-tools { display:flex; gap:14px; align-items:center; font-size:12px; color:var(--muted); }
.st-link { background:none; border:none; padding:0; font:inherit; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.st-link:hover { color:var(--ink); }
.st-link.danger { color:var(--expense); }

.st-sheet-btn { display:inline-flex; align-items:center; gap:6px; }
.st-dot { width:8px; height:8px; border-radius:50%; background:#C9C7BF; display:inline-block; }
.st-dot.idle { background:#9CA3AF; }
.st-dot.ok { background:var(--income); }
.st-dot.syncing { background:#C7A046; }
.st-dot.warn { background:#C7A046; }
.st-dot.error { background:var(--expense); }

.st-sheet { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.st-sheet-title { font-size:14px; font-weight:600; }
.st-sheet-help { margin:6px 0 12px; font-size:13px; line-height:1.5; color:var(--muted); }
.st-field { display:block; margin-top:10px; }
.st-field span { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.st-field input { width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
.st-field input:focus { outline:none; border-color:var(--accent); background:var(--card); }
.st-sheet-actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:14px; }
.st-btn { font:inherit; font-size:13px; color:#fff; background:var(--accent); border:none; border-radius:6px; padding:7px 14px; cursor:pointer; }
.st-btn:disabled, .st-link:disabled { opacity:0.55; cursor:default; }
.st-sheet-status { margin-top:12px; font-size:13px; line-height:1.5; color:var(--muted); }
.st-sheet-status.ok { color:var(--income); }
.st-sheet-status.error { color:var(--expense); }
.st-sheet-status.warn { color:#8A6A12; }

.st-banner { margin-top:16px; padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-size:13px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.st-banner.warn { border-color:#E3B8AE; background:#FDF4F1; }
.st-banner .st-link { color:var(--accent); }
.st-banner .st-link.danger { color:var(--expense); }

.st-month { display:flex; align-items:center; justify-content:center; gap:12px; margin:28px 0 20px; }
.st-month-label { font-size:16px; font-weight:600; min-width:130px; text-align:center; }
.st-icon-btn { display:flex; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px; cursor:pointer; color:var(--ink); }
.st-icon-btn:hover { background:var(--bg); }

.st-summary { display:grid; grid-template-columns:repeat(3,1fr); background:var(--card); border:1px solid var(--line); border-radius:12px; }
.st-sum { padding:16px 18px; }
.st-sum + .st-sum { border-left:1px solid var(--line); }
.st-sum-label { font-size:12px; color:var(--muted); }
.st-sum-value { font-size:20px; font-weight:600; margin-top:4px; }
.st-sum-value.income { color:var(--income); }
.st-sum-value.expense { color:var(--expense); }
.st-copy { margin-top:10px; font-size:12px; }
.st-copy .st-link { color:var(--accent); }

.st-goal { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
.st-goal-top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:13px; }
.st-goal-label { color:var(--muted); }
.st-bar { height:8px; background:var(--bg); border:1px solid var(--line); border-radius:999px; margin-top:10px; overflow:hidden; }
.st-bar-fill { height:100%; background:var(--accent); border-radius:999px; }
.st-bar-fill.done { background:var(--income); }
.st-goal-note { margin-top:8px; font-size:12px; color:var(--muted); }
.st-goal-note.done { color:var(--income); }

.st-lists { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:16px; }
.st-card { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px 10px; }
.st-h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 8px; }

.st-row { display:flex; align-items:center; gap:8px; padding:5px 0; }
.st-name-cell { flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
.st-name { flex:1; width:100%; min-width:0; border:none; border-bottom:1px solid transparent; background:none; font:inherit; font-size:14px; color:var(--ink); padding:4px 0; }
.st-name:hover { border-bottom-color:var(--line); }
.st-name:focus { outline:none; border-bottom-color:var(--accent); }
.st-name[readonly] { color:var(--muted); }
.st-tag { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 7px; white-space:nowrap; }
.st-amount-wrap { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.st-amount { width:112px; text-align:right; font:inherit; font-size:14px; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
.st-amount:focus { outline:none; border-color:var(--accent); background:var(--card); }
.st-unit { font-size:12px; color:var(--muted); }
.st-del { background:none; border:none; color:#B8B5AC; cursor:pointer; padding:4px; display:flex; border-radius:6px; }
.st-del:hover { color:var(--expense); }
.st-del.confirm { color:#fff; background:var(--expense); }

.st-total { display:flex; justify-content:space-between; padding:10px 0 4px; margin-top:6px; border-top:1px solid var(--line); font-size:14px; font-weight:600; }
.st-add { display:flex; align-items:center; gap:6px; background:none; border:none; font:inherit; font-size:13px; color:var(--accent); cursor:pointer; padding:8px 0 10px; }
.st-add:hover { text-decoration:underline; }

.st-more { margin-top:24px; display:flex; justify-content:space-between; align-items:center; font-size:13px; }
.st-history { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.st-empty { color:var(--muted); font-size:13px; }
.st-table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
.st-table th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
.st-table th.r, .st-table td.r { text-align:right; }
.st-table td { padding:8px; border-bottom:1px solid var(--line); cursor:pointer; }
.st-table tr:last-child td { border-bottom:none; }
.st-table tr.active td { font-weight:600; background:var(--bg); }
.st-table td.income { color:var(--income); }
.st-table td.expense { color:var(--expense); }

.st-app button:focus-visible, .st-app input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

@media (max-width:620px) {
  .st-lists { grid-template-columns:minmax(0,1fr); }
  .st-summary { grid-template-columns:1fr; }
  .st-sum { display:flex; justify-content:space-between; align-items:baseline; }
  .st-sum + .st-sum { border-left:none; border-top:1px solid var(--line); }
  .st-sum-value { margin-top:0; }
}
